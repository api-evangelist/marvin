aid: marvin
name: Marvin
description: >-
  Marvin (Marvin Tecnologia Ltda., CNPJ 41.240.161/0001-30) is a São Paulo,
  Brazil based B2B fintech and tech-native collateral agent that transforms
  credit-card and duplicata receivables into registered financial guarantees.
  Born out of Brazilian Central Bank Resolution 264 — which legalized the
  negotiation of credit-card receivables as financial assets — Marvin operates a
  "registration-as-a-service" platform that lets retailers, banks and suppliers
  register, manage and settle receivables-backed collateral, unlocking working
  capital for merchants. The company is backed by a US$15M Series A led by Canaan
  Partners (with Canary and Maúa Capital) and works with partners including B3,
  C6 Bank, Casas Bahia, Electrolux, Pernambucanas and AVLA. Marvin runs a private
  backend (app.marvin.com.br) for its customers; it does not currently publish a
  public developer API, documentation, or SDKs. This profile was added to the API
  Evangelist network as a Canaan Partners portfolio lead and enriched from public
  web sources.
